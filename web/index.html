<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title>
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#1b1c1a;--mute:#5f6159;--line:#dfe0d9;--accent:#0f6b4f;--on-accent:#fff;--accent-soft:#e0f0e9;--amber:#8a5208;--amber-soft:#f8ecd6;--red:#a4332a;--bar:#e7e8e2;--side:#e9ebe5}
@media (prefers-color-scheme:dark){:root{--bg:#141513;--panel:#1d1e1b;--ink:#ecece6;--mute:#a4a69c;--line:#30322d;--accent:#5fcfa6;--on-accent:#10241c;--accent-soft:#17332a;--amber:#e7b566;--amber-soft:#35290f;--red:#ef8d84;--bar:#2c2e29;--side:#191a17}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 12px;min-height:38px}button:hover{border-color:var(--mute)}button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}button:disabled{opacity:.55;cursor:wait}
input,select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:38px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0;letter-spacing:-.01em}.sub{color:var(--mute);font-size:13px}.grow{flex:1 1 auto}
.switch{display:flex;gap:2px;background:var(--bar);padding:3px;border-radius:9px}.switch button{border:0;background:none;color:var(--mute);min-height:32px;padding:4px 14px}.switch button.on{background:var(--panel);color:var(--ink);font-weight:600}
.today{padding:8px 18px;font-size:13.5px;background:var(--accent-soft);color:var(--ink)}.today b{color:var(--accent)}.alert{padding:7px 18px;background:var(--amber-soft);color:var(--amber);font-size:13px}
main{flex:1;min-height:0;display:flex}
/* Board */
.board{flex:1;min-width:0;overflow:auto;padding:14px 18px;display:grid;grid-template-columns:repeat(6,minmax(215px,1fr));gap:10px;align-items:start}
.col h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:2px 2px 6px}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:7px;min-height:0}.card .co{font-size:12.5px;color:var(--mute)}.card .ti{font-weight:600;font-size:13.5px;line-height:1.3;margin:1px 0 5px}.card .me{font-size:12.5px;color:var(--mute)}.card.act{border-color:var(--amber)}
.hint{border:1px dashed var(--line);border-radius:9px;padding:12px;font-size:13px;color:var(--mute)}.more{font-size:12.5px;color:var(--mute);padding:4px 2px}
/* Inbox */
.lists{flex:0 0 190px;background:var(--side);padding:12px 8px;overflow:auto;border-right:1px solid var(--line)}.lists button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;border-radius:7px;margin-bottom:2px}.lists button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.items{flex:0 0 340px;min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.filters{padding:10px;display:flex;gap:6px;border-bottom:1px solid var(--line)}.filters input{flex:1;min-width:0}.scroll{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;padding:10px 13px}.item.on{background:var(--accent-soft)}.item .co{font-size:12.5px;color:var(--mute)}.item .sc{font-weight:700;font-variant-numeric:tabular-nums}.item .ti{grid-column:1/-1;font-weight:600;font-size:14px;line-height:1.3}.item .me{grid-column:1/-1;font-size:12.5px;color:var(--mute);margin-top:2px}
.pane{flex:1;min-width:0;overflow:auto;padding:20px 24px}.empty{color:var(--mute);padding:50px 10px;text-align:center}
/* Job details, shared by both views */
.dh .co{color:var(--mute)}.dh h3{font-size:24px;line-height:1.2;margin:2px 0 6px;letter-spacing:-.01em}.chips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}.flag{color:var(--accent);font-weight:600}.warn{color:var(--amber);font-weight:600}.bad{color:var(--red);font-weight:600}
.detail{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;margin-top:14px}.fac{display:grid;grid-template-columns:72px 1fr 28px;gap:7px;align-items:center;font-size:12.5px;margin-bottom:5px;color:var(--mute)}.track{height:6px;border-radius:3px;background:var(--bar)}.fill{height:6px;border-radius:3px;background:var(--accent)}.fac em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
h4{margin:13px 0 4px;font-size:12.5px;color:var(--mute);font-weight:600}h4:first-child{margin-top:0}.req{white-space:pre-line;font-size:13.5px;max-height:230px;overflow:auto;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions a{text-decoration:none}.p{font-size:13.5px;margin:0}.p+.p{margin-top:4px}
dialog{border:0;border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 32px)}dialog::backdrop{background:rgba(0,0,0,.45)}.dbox{padding:20px 22px;overflow:auto;max-height:calc(100vh - 32px)}.close{float:right}
@media(max-width:820px){main{flex-direction:column;overflow:auto}.lists{flex:none;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.lists button{white-space:nowrap;gap:8px;width:auto}.items{flex:none;border-right:0}.scroll{max-height:42vh}.pane{overflow:visible}.detail{grid-template-columns:1fr}.board{flex:none}}
</style></head><body>
<div class="top"><h1>Job Radar</h1><div class="sub" id="sub">Loading…</div><div class="grow"></div>
<div class="switch" role="group" aria-label="View"><button id="vBoard">Board</button><button id="vInbox">Inbox</button></div>
<button class="primary" id="scan">Scan now</button></div>
<div class="today" id="today"></div><div id="alerts"></div>
<main id="main"></main>
<dialog id="dlg"><div class="dbox" id="dbox"></div></dialog>
<script>
const $=s=>document.querySelector(s),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const LISTS=[["now","Apply today"],["strong","Strong"],["saved","Saved"],["filled","Waiting for Submit"],["applied","Applied"],["other","Others"],["blocked","Blocked"]];
const FAC={fit:"Resume fit",timing:"Timing",level:"Level",sponsor:"Sponsor",brand:"Brand",location:"Location"};
const store={get(k,d){try{return localStorage.getItem(k)||d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let jobs=[],tracker=[],view=store.get("view","board"),list="now",sel=null,q="",role="";
const ago=d=>{if(!d)return"date unknown";const h=(Date.now()-new Date(d))/36e5;return h<1?"just now":h<24?Math.floor(h)+"h ago":Math.floor(h/24)+"d ago"};
const post=(u,b)=>fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
const isML=j=>/machine learning|\bml\b|\bmle\b|\bai\b|\bllm|mlops/i.test(j.title);
const inList=(j,k)=>j.state=="dismissed"?false:k=="saved"?j.state=="saved":j.bucket==k;
const FILLED=["FILLED - TAB OPEN","NEEDS YOU"],APPLIED=["SUBMITTED","SUBMITTED?","LIKELY SUBMITTED"];
const jobForRow=r=>jobs.find(j=>j.tracker_i==r.i);
function chips(j){const e=j.eval,c=el("div","chips"),add=(t,k)=>c.append(el("span",k,t));add(j.location||"Location unknown");add(ago(e.posted||j.first_seen));if(e.years!=null)add(e.years+"+ yrs");if(e.salary)add(e.salary);if(j.applicants>25)add(j.applicants+" applicants");if(j.tags.some(t=>/early/i.test(t)))add("Early applicant","flag");if(e.ats_max>=90)add("Can reach ATS "+Math.round(e.ats_max),"flag");else if(e.ats_max!=null)add("Max ATS "+Math.round(e.ats_max),"warn");if(e.thin_jd)add("Short description, score less certain","warn");if(e.summary_only)add("Summary only, check visa terms on posting","warn");if(e.cooldown)add(e.cooldown,"bad");if(e.at_company)add(e.at_company+" already tracked here","warn");if(e.block)add(e.block,"bad");return c}
async function setState(j,state){await post("/api/state",{id:j.id,state});await load();closeDlg()}
async function showPrep(j,box){const s=await fetch("/api/prep?id="+encodeURIComponent(j.id)).then(r=>r.json());box.replaceChildren(el("h4",null,"Application"));
if(s.state=="running"){box.append(el("p","p","Tailoring the resume…"));setTimeout(()=>{if(box.isConnected)showPrep(j,box)},3000);return}
if(s.state=="failed")box.append(el("p","p bad",s.error));
if(s.state=="ready"){box.append(el("p","p "+(s.passed?"flag":"bad"),`ATS ${s.ats_before} → ${s.ats_after} · ${s.pages} page${s.pages==1?"":"s"} · ${s.passed?"passes the 90 check":"doesn't pass the 90 check"}`),el("p","p","Claude rewording: "+s.claude));if(s.skills_added.length)box.append(el("p","p","Skills added: "+s.skills_added.join(", ")));if(s.not_claimable.length)box.append(el("p","p warn","Missing and can't be claimed: "+s.not_claimable.join(", ")));for(const c of s.changes)box.append(el("p","p","Was: "+c.before),el("p","p flag","Now: "+c.after));for(const r of s.rejected)box.append(el("p","p warn",`Rejected edit: ${r.new_html} (${r.reasons.join("; ")})`))}
const a=el("div","actions"),b=el("button",s.state=="ready"?null:"primary",s.state=="ready"?"Prepare again":"Prepare application");b.onclick=async()=>{b.disabled=true;await post("/api/prepare",{id:j.id});showPrep(j,box)};a.append(b);
if(s.state=="ready"){const v=el("a");v.href="/api/pdf?id="+encodeURIComponent(j.id);v.target="_blank";v.rel="noopener";v.append(el("button",null,"View resume"));a.append(v);if(s.passed&&j.bucket!="filled"){const f=el("button","primary","Fill form (you submit)");f.onclick=async()=>{f.disabled=true;f.textContent="Filling…";const r=await post("/api/fill",{id:j.id});f.disabled=false;f.textContent="Fill form (you submit)";const m=el("div");if(r.ok){m.append(el("p","p flag","Filled. Review it in the job-search Chrome and press Submit yourself."));if(r.needs_you.length){m.append(el("h4",null,"Left for you"));for(const t of r.needs_you)m.append(el("p","p",t))}load()}else m.append(el("p","p bad",r.error));box.append(m)};a.append(f)}}box.append(a)}
function jobDetail(j){const e=j.eval,w=el("div"),h=el("div","dh");h.append(el("div","co",`${j.company} · score ${Math.round(j.score)}`),el("h3",null,j.title),chips(j));const d=el("div","detail"),L=el("div"),R=el("div");L.append(el("h4",null,"Why this score"));for(const k in FAC){const f=el("div","fac"),t=el("div","track"),b=el("div","fill");b.style.width=e.parts[k]+"%";t.append(b);f.append(el("span",null,FAC[k]),t,el("em",null,e.parts[k]));L.append(f)}L.append(el("h4",null,"Sponsorship"),el("p","p",e.sponsor_why),el("h4",null,"Found on"),el("p","p",j.sources.join(", ")));
const a=el("div","actions"),go=el("a");go.href=j.url;go.target="_blank";go.rel="noopener";go.append(el("button","primary","Open posting"));a.append(go);const b=(t,s)=>{const x=el("button",null,t);x.onclick=()=>setState(j,s);a.append(x)};b(j.state=="saved"?"Unsave":"Save",j.state=="saved"?"new":"saved");b("Dismiss","dismissed");if(j.bucket!="applied")b("I applied (updates tracker)","applied");R.append(a);
const P=el("div");R.append(P);showPrep(j,P);if(e.required_missing.length)R.append(el("h4",null,"Required, and you can't claim it"),el("p","p bad",e.required_missing.join(", ")));if(e.missing.length)R.append(el("h4",null,"Add when tailoring, if true for you"),el("p","p",e.missing.join(", ")));R.append(el("h4",null,"Requirements: read before applying"),el("p","req",e.requirements||"No description available from this source."));d.append(L,R);w.append(h,d);return w}
function rowDetail(r){const w=el("div"),h=el("div","dh");h.append(el("div","co",`${r.company} · ${r.date}`),el("h3",null,r.role));w.append(h,el("h4",null,"Status"),el("p","p",r.status));if(r.notes)w.append(el("h4",null,"Notes"),el("p","p",r.notes));w.append(el("h4",null,"Posting"),el("p","p","This role isn't in the current scan, so there's no link here. Its form may still be open in the job-search Chrome."));return w}
function openDlg(node){const box=$("#dbox"),x=el("button","close","Close");x.onclick=closeDlg;box.replaceChildren(x,node);$("#dlg").showModal()}
function closeDlg(){if($("#dlg").open)$("#dlg").close()}
function card(co,ti,me,cls,fn){const b=el("button","card"+(cls?" "+cls:""));b.append(el("div","co",co),el("div","ti",ti),el("div","me",me));b.onclick=fn;return b}
function board(){const b=el("div","board"),col=(name,n,kids,hint)=>{const c=el("section","col"),h=el("h2");h.append(el("span",null,name),el("span",null,n));c.append(h,...kids);if(!kids.length&&hint)c.append(el("div","hint",hint));return c},cap=(a,n)=>a.length>n?[...a.slice(0,n),el("div","more",`+${a.length-n} more in Inbox`)]:a;
const fresh=jobs.filter(j=>["now","strong"].includes(j.bucket)&&!j.prepared&&j.state!="dismissed"&&(!role||(role=="ml")==isML(j))),ready=jobs.filter(j=>j.prepared&&["now","strong","other"].includes(j.bucket)&&j.state!="dismissed");
const rows=s=>tracker.filter(r=>s.includes(r.status)).reverse(),rc=(r,cls,me)=>card(r.company,r.role,me,cls,()=>{const j=jobForRow(r);openDlg(j?jobDetail(j):rowDetail(r))}),fl=rows(FILLED),ap=rows(APPLIED);
b.append(col("New",fresh.length,cap(fresh.map(j=>card(j.company,j.title,`Score ${Math.round(j.score)} · ${ago(j.eval.posted||j.first_seen)}`,"",()=>openDlg(jobDetail(j)))),25)),col("Resume ready",ready.length,ready.map(j=>card(j.company,j.title,"Ready to fill","",()=>openDlg(jobDetail(j)))),"Prepare a job and it moves here."),col("Filled, you submit",fl.length,cap(fl.map(r=>rc(r,"act",r.status=="NEEDS YOU"?"Needs you":"Waiting for your Submit")),25)),col("Applied",ap.length,cap(ap.map(r=>rc(r,"",r.date)),25)),col("Emailed",0,[],"Cold email isn't built yet. Contacts and follow-up dates will show here."),col("Replies and interviews",0,[],"Gmail tracking isn't built yet. Replies will show here."));return b}
function inbox(){const f=document.createDocumentFragment(),nav=el("nav","lists");nav.setAttribute("aria-label","Lists");for(const [k,n] of LISTS){const b=el("button",k==list?"on":"");b.append(el("span",null,n),el("span",null,jobs.filter(j=>inList(j,k)).length));b.onclick=()=>{list=k;sel=null;render()};nav.append(b)}
const it=el("section","items"),fs=el("div","filters"),s=el("input");s.placeholder="Search company or title";s.setAttribute("aria-label","Search");s.value=q;s.oninput=()=>{q=s.value;drawItems()};const r=el("select");r.setAttribute("aria-label","Role type");for(const [v,t] of [["","All"],["ml","ML / AI"],["swe","SWE"]]){const o=el("option",null,t);o.value=v;r.append(o)}r.value=role;r.onchange=()=>{role=r.value;drawItems()};fs.append(s,r);const sc=el("div","scroll");it.append(fs,sc);const pane=el("section","pane");
function drawItems(){const lq=q.toLowerCase(),a=jobs.filter(j=>inList(j,list)&&(!lq||(j.company+" "+j.title).toLowerCase().includes(lq))&&(!role||(role=="ml")==isML(j)));if(!a.find(j=>j.id==sel))sel=a[0]?.id??null;sc.replaceChildren(...(a.length?a.slice(0,200).map(j=>{const b=el("button","item"+(j.id==sel?" on":""));b.append(el("span","co",j.company),el("span","sc",Math.round(j.score)),el("span","ti",j.title),el("span","me",`${(j.location||"").slice(0,32)} · ${ago(j.eval.posted||j.first_seen)}`));b.onclick=()=>{sel=j.id;drawItems()};return b}):[el("div","empty","Nothing here for these filters.")]));const j=jobs.find(x=>x.id==sel);pane.replaceChildren(j?jobDetail(j):el("div","empty","Pick a job to see its details."))}
f.append(nav,it,pane);drawItems();return f}
function render(){$("#vBoard").className=view=="board"?"on":"";$("#vInbox").className=view=="inbox"?"on":"";$("#main").replaceChildren(view=="board"?board():inbox())}
async function load(){const [J,S,T]=await Promise.all(["jobs","status","tracker"].map(p=>fetch("/api/"+p).then(r=>r.json())));jobs=J;tracker=T;const s=S.scan,P=S.pipeline;$("#scan").disabled=S.scanning;$("#scan").textContent=S.scanning?"Scanning…":"Scan now";$("#sub").textContent=s?`Last scan ${ago(s.at)} · ${s.total} roles · ${s.new} new`:"No scan yet";
const t=$("#today");t.replaceChildren("Today: ",el("b",null,P.waiting)," filled forms to submit · ",el("b",null,jobs.filter(j=>inList(j,"now")).length)," roles to apply to · ",el("b",null,P.applied)," applied so far");
const al=[];if(s)for(const [k,v] of Object.entries(s.status)){if(k[0]=="_")continue;if(!v.ok)al.push(`${k} didn't scan: ${v.error||"all boards failed"}`)}$("#alerts").replaceChildren(...al.map(x=>el("div","alert",x)));if(!$("#dlg").open)render();if(S.scanning)setTimeout(load,5000)}
const setView=v=>{view=v;store.set("view",v);render()};$("#vBoard").onclick=()=>setView("board");$("#vInbox").onclick=()=>setView("inbox");
$("#scan").onclick=async()=>{await post("/api/scan",{});$("#scan").disabled=true;$("#scan").textContent="Scanning…";setTimeout(load,3000)};load();
</script></body></html>
