<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title>
<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}

.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0;letter-spacing:-.01em}.sub{color:var(--mute);font-size:13px}.grow{flex:1 1 auto}

h4{margin:13px 0 4px;font-size:12.5px;color:var(--mute);font-weight:600}h4:first-child{margin-top:0}.req{white-space:pre-line;font-size:13.5px;max-height:230px;overflow:auto;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions a{text-decoration:none}.p{font-size:13.5px;margin:0}.p+.p{margin-top:4px}

const slug=s=>s.replace(/[^A-Za-z0-9]/g,"").slice(0,30),learnId=(r,a,x)=>"learn-"+slug(r)+"-"+slug(a)+"-"+slug(x);
let learnRole=store.get("learnRole","All roles");
function learning(){const w=el("div","prep"),b=el("div","pwrap"),all=LEARN.flatMap(([r,as])=>as.flatMap(([a,xs])=>xs.map(x=>learnId(r,a,x)))),n=all.filter(i=>done.has(i)).length,pr=el("div","prog"),f=el("div");f.style.width=(100*n/all.length)+"%";pr.append(f);const sw=el("div","switch");sw.style.marginBottom="14px";sw.style.flexWrap="wrap";sw.setAttribute("role","group");sw.setAttribute("aria-label","Role");for(const [r,as] of LEARN){const ids=as.flatMap(([a,xs])=>xs.map(x=>learnId(r,a,x))),k=el("button",r==learnRole?"on":"",`${r} ${ids.filter(i=>done.has(i)).length}/${ids.length}`);k.onclick=()=>{learnRole=r;store.set("learnRole",r);render()};sw.append(k)}
const g=el("div","pgrid");for(const [a,xs] of LEARN.find(x=>x[0]==learnRole)[1]){const s=el("section","area"),m=xs.filter(x=>done.has(learnId(learnRole,a,x))).length;s.append(el("h3",null,a),el("div","n",`${m} of ${xs.length} done`));for(const x of xs){const id=learnId(learnRole,a,x),l=el("label"),cb=el("input");cb.type="checkbox";cb.checked=done.has(id);cb.onchange=async()=>{cb.checked?done.add(id):done.delete(id);await post("/api/study",{id,done:cb.checked});render()};l.append(cb,el("span",null,x));s.append(l)}g.append(s)}b.append(el("h2",null,"Learning"),el("div","sub",`${n} of ${all.length} topics done`),pr,sw,g);w.append(b);return w}
let done=new Set();
function prep(){const w=el("div","prep"),b=el("div","pwrap"),total=PREP.reduce((n,a)=>n+a[2].length,0),own=PREP.reduce((n,a)=>n+a[2].filter((_,i)=>done.has(studyId(a[0],i))).length,0),t=el("h2",null,"Preparation"),c=el("div","sub",`${own} of ${total} done`),pr=el("div","prog"),f=el("div");f.style.width=(100*own/total)+"%";pr.append(f);const g=el("div","pgrid");for(const [name,note,items] of PREP){const a=el("section","area"),n=items.filter((_,i)=>done.has(studyId(name,i))).length;a.append(el("h3",null,`${name} (${n}/${items.length})`),el("div","n",note));items.forEach((x,i)=>{const id=studyId(name,i),l=el("label"),cb=el("input");cb.type="checkbox";cb.checked=done.has(id);cb.onchange=async()=>{cb.checked?done.add(id):done.delete(id);await post("/api/study",{id,done:cb.checked});render()};l.append(cb,el("span",null,x));a.append(l)});g.append(a)}b.append(t,c,pr,g);w.append(b);return w}
function render(){$("#vBoard").className=view=="board"?"on":"";$("#vInbox").className=view=="inbox"?"on":"";$("#vPrep").className=view=="prep"?"on":"";$("#vLearn").className=view=="learn"?"on":"";$("#main").replaceChildren(view=="board"?board():view=="prep"?prep():view=="learn"?learning():inbox())}
async function load(){const [J,S,T,D]=await Promise.all(["jobs","status","tracker","study"].map(p=>fetch("/api/"+p).then(r=>r.json())));jobs=J;tracker=T;done=new Set(D);const s=S.scan,P=S.pipeline;$("#scan").disabled=S.scanning;$("#scan").textContent=S.scanning?"Scanning…":"Scan now";$("#sub").textContent=s?`Last scan ${ago(s.at)} · ${s.total} roles · ${s.new} new`:"No scan yet";
const t=$("#today");t.replaceChildren("Today: ",el("b",null,P.waiting)," filled forms to submit · ",el("b",null,jobs.filter(j=>inList(j,"now")).length)," roles to apply to · ",el("b",null,P.applied)," applied so far");
const al=[];if(s)for(const [k,v] of Object.entries(s.status)){if(k[0]=="_")continue;if(!v.ok)al.push(`${k} didn't scan: ${v.error||"all boards failed"}`)}$("#alerts").replaceChildren(...al.map(x=>el("div","alert",x)));if(!$("#dlg").open&&!(["prep","learn"].includes(view)&&document.activeElement?.type=="checkbox"))render();if(S.scanning)setTimeout(load,5000)}
const setView=v=>{view=v;store.set("view",v);render()};$("#vBoard").onclick=()=>setView("board");$("#vInbox").onclick=()=>setView("inbox");$("#vPrep").onclick=()=>setView("prep");$("#vLearn").onclick=()=>setView("learn");$("#src").onchange=e=>{source=e.target.value;sel=null;render()};
$("#scan").onclick=async()=>{await post("/api/scan",{});$("#scan").disabled=true;$("#scan").textContent="Scanning…";setTimeout(load,3000)};load();
</script></body></html>
