<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.switch{display:flex;gap:2px;background:var(--bar);padding:3px;border-radius:12px}.switch button{border:0;background:none;color:var(--mute);min-height:34px;padding:4px 16px;border-radius:9px}.switch button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.1)}
.alerts summary{cursor:pointer;padding:8px 22px;background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:600}.alert{padding:5px 22px;background:var(--amber-soft);color:var(--amber);font-size:13px}

.side .nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:0;background:none;color:var(--navtext);border-radius:10px;padding:0 12px;font-size:15px;text-align:left}.side .nav:hover{background:var(--nav2)}.side .nav.on{background:var(--nav2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #818cf8}.side .nav svg{flex:none}
.side .ct{margin-left:auto;padding:1px 8px;border-radius:999px;background:#4338ca;color:#fff;font-size:12px;font-weight:700}.side .ct:empty{display:none}
.side select{width:100%;background:var(--nav2);color:#e2e8f0;border-color:#334155;margin-top:6px}.side .sub{color:#94a3b8;padding:2px 4px}.side button.primary{background:#4338ca;border-color:#4338ca;color:#fff;width:100%;min-height:44px}
.cd{background:var(--nav2);border-radius:14px;padding:14px 16px;margin-top:6px}.cd .sub{padding:0}.cd b{display:block;font:800 30px Sora,Inter,sans-serif;color:#fff}.cd .bar{height:6px;border-radius:3px;background:#334155;margin-top:6px}.cd .bar div{height:6px;border-radius:3px;background:#818cf8}

.home{flex:1;min-width:0;overflow:auto;padding:22px 28px}.hwrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}.flipbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner{background:#4338ca;color:#fff;border-radius:22px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;box-shadow:0 12px 32px rgba(67,56,202,.25)}.banner h1{color:#fff;font-size:26px;margin-top:4px}.banner .sub{color:#c7d2fe}.banner p{margin:6px 0 0;color:#e0e7ff;font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.13);border-radius:14px;padding:10px 16px;min-width:88px}.stat b{display:block;font:800 24px Sora,Inter,sans-serif}.stat span{font-size:12px;color:#e0e7ff}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}.stack{display:flex;flex-direction:column;gap:18px}.wide{flex:999 1 520px;min-width:0}.narrow{flex:1 1 300px;min-width:0}
.next{background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.nh{background:#0f172a;color:#fff;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.nh .k{font-size:12px;font-weight:700;letter-spacing:.06em;color:#a5b4fc}.nh h2{font:700 21px/1.25 Sora,Inter,sans-serif;margin:4px 0 0}.nh .w{font-size:14px;color:#cbd5e1;margin-top:2px}.nb{padding:18px 22px;display:flex;flex-direction:column;gap:16px}

.badges{display:flex;gap:6px;flex-wrap:wrap}.bdg{padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700}.b-blue{background:var(--blue-soft);color:var(--blue)}.b-ind{background:var(--accent-soft);color:var(--accent)}.b-amb{background:var(--amber-soft);color:var(--amber)}.b-grn{background:var(--green-soft);color:var(--green)}.b-gry{background:var(--bar);color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.big{min-height:52px;padding:0 24px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(67,56,202,.3)}.soft{min-height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--bar);font-weight:600}

.ph{display:flex;align-items:center;gap:10px}.ph h2{font:700 17px Sora,Inter,sans-serif;margin:0;flex:1}.cnt{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.li{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px}.li>div{flex:1;min-width:0}.li .t{font-size:14px;font-weight:600}.li .s{font-size:12.5px}.li button{border:0;min-height:36px;font-weight:700;font-size:13px}
.li.amb{background:var(--amber-soft)}.li.amb .s{color:var(--amber)}.li.amb button{background:#b45309;color:#fff}.li.dk{background:#1e293b}.li.dk .t{color:#fff}.li.dk .s{color:#94a3b8}.li.dk button{background:#10b981;color:#0f172a}
.jrow{background:var(--panel);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow)}.jrow>div{flex:1 1 240px;min-width:0}.jrow .t{font-size:15px;font-weight:700;margin-top:4px}.jrow .s{font-size:13px;color:var(--mute)}.jrow .sc{font:800 20px Sora,Inter,sans-serif;color:var(--accent)}.jrow button{border:0;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.pipe button{border:0;border-radius:14px;padding:12px 14px;text-align:left}.pipe b{display:block;font:800 24px Sora,Inter,sans-serif}
.empty-card{border:2px dashed var(--line);border-radius:16px;padding:16px;font-size:14px;color:var(--mute)}
/* Board */
.bview{flex:1;min-width:0;display:flex;flex-direction:column}.bview .flipbar{padding:18px 22px 0}
.board{flex:1;min-width:0;overflow:auto;padding:14px 22px;display:grid;grid-template-columns:repeat(6,minmax(215px,1fr));gap:12px;align-items:start}.col{background:var(--side);border-radius:16px;padding:10px}
.col h2{font-size:13px;margin:0 0 8px;color:var(--ink);font-weight:700;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--side);padding:2px 4px 6px}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:0;border-radius:12px;padding:10px 12px;margin-bottom:8px;min-height:0;box-shadow:0 1px 2px rgba(15,23,42,.08)}.card .co{font-size:12.5px;color:var(--mute)}.card .ti{font-weight:600;font-size:13.5px;line-height:1.3;margin:1px 0 5px}.card .me{font-size:12.5px;color:var(--mute)}.card.act{box-shadow:0 0 0 2px #f59e0b}
.hint{border:1px dashed var(--line);border-radius:9px;padding:12px;font-size:13px;color:var(--mute)}.more{font-size:12.5px;color:var(--mute);padding:4px 2px}
/* Inbox */
.lists{flex:0 0 190px;background:var(--side);padding:12px 8px;overflow:auto;border-right:1px solid var(--line)}.lists button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;border-radius:7px;margin-bottom:2px}.lists button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.items{flex:0 0 340px;min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.filters{padding:10px;display:flex;gap:6px;border-bottom:1px solid var(--line)}.filters input{flex:1;min-width:0}.scroll{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;padding:10px 13px}.item.on{background:var(--accent-soft)}.item .co{font-size:12.5px;color:var(--mute)}.item .sc{font-weight:700;font-variant-numeric:tabular-nums}.item .ti{grid-column:1/-1;font-weight:600;font-size:14px;line-height:1.3}.item .me{grid-column:1/-1;font-size:12.5px;color:var(--mute);margin-top:2px}
.pane{flex:1;min-width:0;overflow:auto;padding:20px 24px}.empty{color:var(--mute);padding:50px 10px;text-align:center}
/* Preparation */
.prep{flex:1;min-width:0;overflow:auto;padding:20px 18px}.pwrap{max-width:980px;margin:0 auto}.pwrap>h2{font-size:24px;margin:0;letter-spacing:-.01em}.prog{height:8px;background:var(--bar);border-radius:4px;margin:12px 0 18px}.prog div{height:8px;background:var(--accent);border-radius:4px}.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}.area{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}.area h3{font-size:16px;margin:0 0 3px}.area .n{font-size:13px;color:var(--mute);margin-bottom:9px}.area label{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}.area input{min-height:0;margin:3px 0 0;flex:none;width:16px;height:16px;accent-color:var(--accent)}
/* Job details, shared by both views */
.dh .co{color:var(--mute)}.dh h3{font-size:24px;line-height:1.2;margin:2px 0 6px;letter-spacing:-.01em}.chips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}.flag{color:var(--accent);font-weight:600}.warn{color:var(--amber);font-weight:600}.bad{color:var(--red);font-weight:600}
.detail{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;margin-top:14px}.fac{display:grid;grid-template-columns:72px 1fr 28px;gap:7px;align-items:center;font-size:12.5px;margin-bottom:5px;color:var(--mute)}.track{height:6px;border-radius:3px;background:var(--bar)}.fill{height:6px;border-radius:3px;background:var(--accent)}.fac em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
h4{margin:13px 0 4px;font-size:12.5px;color:var(--mute);font-weight:600}h4:first-child{margin-top:0}.req{white-space:pre-line;font-size:13.5px;max-height:230px;overflow:auto;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions a{text-decoration:none}.p{font-size:13.5px;margin:0}.p+.p{margin-top:4px}
/* Companies */
.cmap{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:18px;align-items:start}.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;position:sticky;top:0}.mapbox>svg{width:100%;height:auto;display:block}.mapbox .water{fill:var(--accent-soft);stroke:none}.lmap{height:520px;border-radius:7px;z-index:0}.lmap .leaflet-tooltip{font:12px/1.3 -apple-system,BlinkMacSystemFont,sans-serif}.ctab a.gm{font-size:12.5px;color:var(--accent);white-space:nowrap}
.mapbox circle{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:1.5;cursor:pointer}.mapbox circle.on{fill-opacity:.85}.mapbox text{font-size:11px;fill:var(--ink);pointer-events:none}.mapbox .note{font-size:12px;color:var(--mute);padding:4px 6px 2px}
.ctab{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13.5px}.ctab th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}.ctab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.ctab td.n{text-align:right;font-variant-numeric:tabular-nums}.ctab button{min-height:30px;padding:3px 9px;font-size:13px;white-space:nowrap}
@media(max-width:820px){.cmap{grid-template-columns:1fr}.mapbox{position:static}.ctab .hide{display:none}.switch{max-width:100%;overflow-x:auto}.switch button{white-space:nowrap}}
dialog{border:0;border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 32px)}dialog::backdrop{background:rgba(0,0,0,.45)}.dbox{padding:20px 22px;overflow:auto;max-height:calc(100vh - 32px)}.close{float:right}
@media(max-width:820px){.app{flex-direction:column;height:auto;min-height:100%}.side{flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.brand{padding:0 8px 0 4px}.side .nav{width:auto;min-height:40px;padding:0 10px}.cd,.side .grow{display:none}.side select,.side button.primary{width:auto}.home{padding:16px}.banner{padding:18px}.nh,.nb{padding:16px}
main{flex-direction:column;overflow:auto}.lists{flex:none;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.lists button{white-space:nowrap;gap:8px;width:auto}.items{flex:none;border-right:0}.scroll{max-height:42vh}.pane{overflow:visible}.detail{grid-template-columns:1fr}.board{flex:none}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const LISTS=[["now","Apply today"],["strong","Strong"],["saved","Saved"],["filled","Waiting for Submit"],["applied","Applied"],["other","Others"],["blocked","Blocked"]];
const FAC={fit:"Resume fit",timing:"Timing",level:"Level",sponsor:"Sponsor",brand:"Brand",location:"Location"};
const store={get(k,d){try{return localStorage.getItem(k)||d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let source="",jobs=[],tracker=[],view=store.get("view","home"),list="now",sel=null,q="",role="";
const ago=d=>{if(!d)return"date unknown";const h=(Date.now()-new Date(d))/36e5;return h<1?"just now":h<24?Math.floor(h)+"h ago":Math.floor(h/24)+"d ago"};
const post=(u,b)=>fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
const isML=j=>/machine learning|\bml\b|\bmle\b|\bai\b|\bllm|mlops/i.test(j.title);
const fromSrc=j=>!source||j.sources.includes(source);const inList=(j,k)=>!fromSrc(j)||j.state=="dismissed"?false:k=="saved"?j.state=="saved":j.bucket==k;
const FILLED=["FILLED - TAB OPEN","NEEDS YOU"],APPLIED=["SUBMITTED","SUBMITTED?","LIKELY SUBMITTED"];
const jobForRow=r=>jobs.find(j=>j.tracker_i==r.i);
function chips(j){const e=j.eval,c=el("div","chips"),add=(t,k)=>c.append(el("span",k,t));add(j.location||"Location unknown");add(ago(e.posted||j.first_seen));if(e.years!=null)add(e.years+"+ yrs");if(e.salary)add(e.salary);if(j.applicants>25)add(j.applicants+" applicants");if(j.tags.some(t=>/early/i.test(t)))add("Early applicant","flag");if(e.ats_max>=90)add("Can reach ATS "+Math.round(e.ats_max),"flag");else if(e.ats_max!=null)add("Max ATS "+Math.round(e.ats_max),"warn");if(e.thin_jd)add("Short description, score less certain","warn");if(e.summary_only)add("Summary only, check visa terms on posting","warn");if(e.cooldown)add(e.cooldown,"bad");if(e.at_company)add(e.at_company+" already tracked here","warn");if(e.block)add(e.block,"bad");return c}
async function setState(j,state){await post("/api/state",{id:j.id,state});await load();closeDlg()}
async function showPrep(j,box){const s=await fetch("/api/prep?id="+encodeURIComponent(j.id)).then(r=>r.json());box.replaceChildren(el("h4",null,"Application"));
