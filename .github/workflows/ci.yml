name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Personal data must never reach this public repo
      - name: No personal files tracked
        run: |
          bad=$(git ls-files | grep -E '^(data/|output/|radar\.db|\.jobright\.json|extension/config\.js$|apply/gmail_drafts\.py$|profile\.(json|md)$|.*\.log$|\.env)' || true)
          if [ -n "$bad" ]; then echo "Personal files are tracked:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Node tests
        run: npm test
