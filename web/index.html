.mapbox circle{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:1.5;cursor:pointer}.mapbox circle.on{fill-opacity:.85}.mapbox text{font-size:11px;fill:var(--ink);pointer-events:none}.mapbox .note{font-size:12px;color:var(--mute);padding:4px 6px 2px}

function referral(r){const w=el("div"),note=el("textarea");w.append(el("h3",null,`Ask for a referral at ${r.company}`),el("p","p",`For: ${r.role}. Find 2 or 3 engineers there, ideally from your school or a past company, and send this. The app never sends anything.`));const a=el("div","actions"),li=el("a");li.href="https://www.linkedin.com/search/results/people/?keywords="+encodeURIComponent(r.company+" engineer");li.target="_blank";li.rel="noopener";li.append(el("button",null,`Find people at ${r.company} on LinkedIn`));a.append(li);
note.rows=7;note.style.width="100%";note.style.marginTop="12px";note.setAttribute("aria-label","Referral note");note.value=`Hi [Name], I just applied for the ${r.role} role at ${r.company}. [One line about your most relevant work and a result.] Would you be open to referring me? I'm happy to send my resume. Thank you!`;
const b=el("div","actions"),cp=el("button","primary","Copy note");cp.onclick=async()=>{try{await navigator.clipboard.writeText(note.value);cp.textContent="Copied"}catch{note.select()}};const ms=el("button",null,"Mark as sent");ms.onclick=async()=>{await post("/api/referral",{company:r.company,role:r.role,sent:true});await load();closeDlg()};b.append(cp,ms);w.append(a,note,b);return w}
function render(){for(const [id,vs] of [["#vHome",["home","board"]],["#vInbox",["inbox"]],["#vPrep",["prep"]],["#vLearn",["learn"]],["#vCo",["co"]]])$(id).className="nav"+(vs.includes(view)?" on":"");let node;if(view=="board"){node=el("div","bview");node.append(flip(),board())}else node=view=="home"?home():view=="prep"?prep():view=="learn"?learning():view=="co"?companies():inbox();$("#main").replaceChildren(node)}
async function load(){const [J,S,T,D,R,F]=await Promise.all(["jobs","status","tracker","study","referrals","followups"].map(p=>fetch("/api/"+p).then(r=>r.json())));jobs=J;tracker=T;done=new Set(D);refs=R;fups=F;const s=S.scan,P=S.pipeline;pipe=P;lastScan=s&&s.at;$("#scan").disabled=S.scanning;$("#scan").textContent=S.scanning?"Scanning…":"Scan now";$("#sub").textContent=s?`Last scan ${ago(s.at)} · ${s.total} roles · ${s.new} new`:"No scan yet";$("#nNow").textContent=jobs.filter(j=>inList(j,"now")).length||"";
const days=Math.max(0,Math.round((new Date(GOAL.date)-new Date(today()))/864e5)),span=(new Date(GOAL.date)-new Date(GOAL.start))/864e5,cd=$("#cd"),bar=el("div","bar"),f=el("div");f.style.width=Math.min(100,100*(1-days/span))+"%";bar.append(f);cd.replaceChildren(el("div","sub",`Days to ${GOAL.label}`),el("b",null,days),bar);
const al=[];if(s)for(const [k,v] of Object.entries(s.status)){if(k[0]=="_")continue;if(!v.ok)al.push(`${k} didn't scan: ${v.error||"all boards failed"}`)}for(const [h,t] of Object.entries(S.resting||{}))al.push(`${h} asked the app to slow down, so it is left alone until ${new Date(t*1000).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`);if(al.length){const d=el("details","alerts");d.append(el("summary",null,`${al.length} scan note${al.length>1?"s":""}`),...al.map(x=>el("div","alert",x)));$("#alerts").replaceChildren(d)}else $("#alerts").replaceChildren();if(!$("#dlg").open&&!(["prep","learn"].includes(view)&&document.activeElement?.type=="checkbox"))render();if(S.scanning)setTimeout(load,5000)}
const setView=v=>{view=v;store.set("view",v);render()};$("#vHome").onclick=()=>setView("home");$("#vInbox").onclick=()=>setView("inbox");$("#vPrep").onclick=()=>setView("prep");$("#vLearn").onclick=()=>setView("learn");$("#vCo").onclick=()=>setView("co");$("#src").onchange=e=>{source=e.target.value;sel=null;render()};
